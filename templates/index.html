
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶龍救援任務</title>
</head>
<body>
    <h1>奶龍救援任務</h1>
    <p>歡迎來到程式解題挑戰！</p>
    <p>目前累積答對：{{ correct_count }} 題</p>
    <p>距離下一組金鑰還差：{{ 5 - (correct_count % 5) }} 題</p>
    <p>目前剩餘金鑰：{{ remaining_keys }} 組</p>
    <h2>{{ question.question }}</h2>

    <form action="/answer" method="post">
        <input
            type="hidden"
            name="question_id"
            value="{{ question.id }}"
        >

        {% for option in question.options %}
            <label>
                <input
                    type="radio"
                    name="answer"
                    value="{{ option[0] }}"
                    required
                >
                {{ option }}
            </label>
            <br>
        {% endfor %}

        <br>
        <button type="submit">提交答案</button>
    </form>
</body>
</html>
